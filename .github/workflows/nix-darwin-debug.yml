# Darwin build reproduction for the cargo-tauri stub-binary issue
# (NixOS/nixpkgs#507754, cjpais/Handy discussion #1242). Runs only on the
# debug/darwin-flake branch — not meant for upstream Handy CI.
name: "nix darwin debug"

on:
  workflow_dispatch:
  push:
    branches: [debug/darwin-flake]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  darwin-build:
    runs-on: macos-latest  # aarch64-darwin (x86_64-darwin pool retired)
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Show host info
        run: |
          uname -a
          sw_vers
          nix --version
          xcode-select -p || true
          xcrun --sdk macosx --show-sdk-path || true

      - name: nix build .#handy
        id: build
        run: |
          set -o pipefail
          nix build .#handy -L --show-trace 2>&1 | tee build.log

      - name: Install coreutils for `timeout`
        run: nix profile install nixpkgs#coreutils

      - name: Diagnose binary (stub check)
        if: always()
        run: |
          set +e
          TIMEOUT="$(command -v timeout || command -v gtimeout)"
          echo "Using timeout binary: $TIMEOUT"

          echo "::group::Tree"
          ls -la result/ result/Applications/ 2>/dev/null || true
          APP="result/Applications/Handy.app"
          BIN="$APP/Contents/MacOS/handy"
          if [ ! -e "$BIN" ]; then
            echo "Expected binary not found at $BIN"
            find result -maxdepth 6 2>/dev/null | head -60
            exit 0
          fi
          echo "::endgroup::"

          echo "::group::Size"
          ls -la "$BIN"
          stat -f '%z bytes' "$BIN"
          echo "::endgroup::"

          echo "::group::file(1)"
          file "$BIN"
          echo "::endgroup::"

          echo "::group::otool -L (dylib deps)"
          otool -L "$BIN"
          echo "::endgroup::"

          echo "::group::otool -l (load commands + rpaths, first 200 lines)"
          otool -l "$BIN" | head -200
          echo "::endgroup::"

          echo "::group::LC_MAIN presence"
          otool -l "$BIN" | grep -A 3 LC_MAIN || echo "NO LC_MAIN (would be very suspicious)"
          echo "::endgroup::"

          echo "::group::_main symbol"
          nm "$BIN" 2>&1 | grep -E " _main$" || echo "NO _main symbol (stub indicator)"
          echo "::endgroup::"

          echo "::group::_main disassembly (first 40 insns)"
          otool -tV "$BIN" 2>&1 | awk '/^_main:/{p=1; print; next} p && /^_[A-Za-z]/{exit} p{print; n++; if(n>40) exit}'
          echo "::endgroup::"

          echo "::group::Rust entry symbols (std::rt / panic handlers)"
          nm "$BIN" 2>&1 | grep -E "(std.*rt.*lang_start|_ZN3std2rt|__rust_begin|__rust_panic)" | head -20 || echo "NO rust entry markers"
          echo "::endgroup::"

          echo "::group::Symbol count by type"
          nm "$BIN" 2>&1 | awk '{print $2}' | sort | uniq -c | sort -rn | head -30
          echo "::endgroup::"

          echo "::group::Info.plist"
          plutil -p "$APP/Contents/Info.plist" 2>&1 | head -40
          echo "::endgroup::"

          echo "::group::Bundle size breakdown"
          du -sh "$APP" 2>/dev/null
          du -sh "$APP/Contents/"* 2>/dev/null
          du -sh "$APP/Contents/Resources/"* 2>/dev/null | head -20
          echo "::endgroup::"

          run_with_timing() {
            local label="$1"; shift
            echo "::group::$label"
            local start=$(date +%s%N)
            # --preserve-status: let us see actual exit. 124 = timeout expired.
            "$TIMEOUT" --preserve-status 5 "$@" 2>&1 | head -40
            local rc=$?
            local end=$(date +%s%N)
            local elapsed_ms=$(( (end - start) / 1000000 ))
            echo "---"
            echo "exit=$rc, wall=${elapsed_ms}ms"
            if [ "$elapsed_ms" -lt 500 ]; then
              echo "VERDICT: died within 500ms — likely stub or early-crash"
            else
              echo "VERDICT: lived past 500ms — real event loop / slow startup"
            fi
            echo "::endgroup::"
          }

          run_with_timing "Try to run (--help)" "$BIN" --help
          run_with_timing "Try to run (--version)" "$BIN" --version
          run_with_timing "Try to run (no args)" "$BIN"

      - name: Upload .app bundle for offline analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Handy.app-${{ github.sha }}
          path: result/Applications/Handy.app
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: warn
          retention-days: 14
